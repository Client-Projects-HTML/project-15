<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Vantage</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23AD49E1'/%3E%3Cg transform='translate(6,6)' stroke='%23ffffff' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolygon points='10,2 2,6 10,10 18,6'/%3E%3Cpolyline points='2,10 10,14 18,10'/%3E%3Cpolyline points='2,14 10,18 18,14'/%3E%3C/g%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
        <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#AD49E1',
                            dark: '#9333C3',
                            light: '#F5E9FD',
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-slate-50 dark:bg-slate-950 font-sans flex items-center justify-center min-h-screen p-4">

    <div
        class="max-w-xs w-full bg-white dark:bg-slate-900 rounded-[24px] shadow-2xl p-5 border border-slate-100 dark:border-slate-800">
        <div class="text-center mb-5">
            <a href="home-1.html" class="inline-flex items-center gap-2 text-lg font-black text-primary mb-2">
                <i data-lucide="layers" class="w-5 h-5"></i>
                <span>Vantage</span>
            </a>
            <h1 class="text-lg font-black mb-1">Forgot Password</h1>
            <p class="text-slate-500 text-[10px]">Enter your email to reset your password.</p>
        </div>

        <form id="reset-form" class="space-y-3">
            <div class="space-y-1">
                <label class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Email Address</label>
                <div class="relative">
                    <input type="email" placeholder="name@company.com" required
                        class="w-full p-2 ps-8 rounded-lg bg-slate-50 dark:bg-slate-800 border-2 border-transparent focus:border-primary outline-none transition text-[10px]">
                    <i data-lucide="mail"
                        class="w-3 h-3 absolute start-2.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-primary hover:bg-primary-dark text-white p-2 rounded-lg font-bold text-[10px] transition shadow-md shadow-primary/20 btn-primary">
                Reset Password
            </button>
        </form>

        <div id="success-message" class="hidden mt-4 text-center">
            <p
                class="text-emerald-500 text-[10px] font-bold bg-emerald-50 dark:bg-emerald-900/10 p-2 rounded-lg border border-emerald-100 dark:border-emerald-900/20">
                Password reset link sent to your email!
            </p>
        </div>

        <p class="mt-5 text-center text-slate-500 font-bold text-[10px]">
            Remember your password? <a href="login.html" class="text-primary hover:underline">Back to Login</a>
        </p>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        lucide.createIcons();

        document.getElementById('reset-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const form = this;
            const successMessage = document.getElementById('success-message');

            // Simulate API call
            const btn = form.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Sending...';
            btn.disabled = true;
            btn.classList.add('opacity-70');

            setTimeout(() => {
                form.style.display = 'none';
                successMessage.classList.remove('hidden');
            }, 1500);
        });
    </script>
</body>

</html>
