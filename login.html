<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vantage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-slate-50 dark:bg-slate-950 font-sans flex items-center justify-center min-h-screen p-4">

    <div
        class="max-w-md w-full bg-white dark:bg-slate-900 rounded-[40px] shadow-2xl p-10 border border-slate-100 dark:border-slate-800">
        <div class="text-center mb-10">
            <a href="home-1.html" class="inline-flex items-center gap-2 text-2xl font-black text-primary mb-6">
                <i data-lucide="layers" class="w-8 h-8"></i>
                <span>Vantage</span>
            </a>
            <h1 class="text-3xl font-black mb-2">Welcome Back</h1>
            <p class="text-slate-500">Sign in to manage your services.</p>
        </div>

        <form onsubmit="event.preventDefault();" class="space-y-6">
            <div class="space-y-2">
                <label class="text-sm font-bold uppercase tracking-widest text-slate-400">Email Address</label>
                <div class="relative">
                    <input type="email" placeholder="name@company.com"
                        class="w-full p-4 pl-12 rounded-2xl bg-slate-50 dark:bg-slate-800 border-2 border-transparent focus:border-primary outline-none transition">
                    <i data-lucide="mail" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                </div>
            </div>
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-bold uppercase tracking-widest text-slate-400">Password</label>
                    <a href="#" class="text-xs font-bold text-primary hover:underline">Forgot?</a>
                </div>
                <div class="relative">
                    <input type="password" placeholder="••••••••"
                        class="w-full p-4 pl-12 rounded-2xl bg-slate-50 dark:bg-slate-800 border-2 border-transparent focus:border-primary outline-none transition">
                    <i data-lucide="lock" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <input type="checkbox" id="remember" class="w-5 h-5 rounded accent-primary">
                <label for="remember" class="text-sm font-bold text-slate-500">Remember me for 30 days</label>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <a href="dashboard/admin/index.html"
                    class="flex items-center justify-center bg-slate-800 hover:bg-slate-900 text-white p-4 rounded-2xl font-bold transition shadow-xl shadow-slate-900/10 text-center">
                    Admin Login
                </a>
                <a href="dashboard/client/index.html"
                    class="flex items-center justify-center bg-primary hover:bg-primary-dark text-white p-4 rounded-2xl font-bold transition shadow-xl shadow-primary/20 text-center">
                    Client Login
                </a>
            </div>
        </form>

        <div class="mt-8 flex items-center gap-4 py-4">
            <div class="h-px bg-slate-200 dark:bg-slate-800 flex-1"></div>
            <span class="text-xs font-black uppercase tracking-widest text-slate-400">Or continue with</span>
            <div class="h-px bg-slate-200 dark:bg-slate-800 flex-1"></div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-6">
            <button
                class="flex items-center justify-center gap-2 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 font-bold transition">
                <img src="https://www.svgrepo.com/show/355037/google.svg" class="w-5" alt="G"> Google
            </button>
            <button
                class="flex items-center justify-center gap-2 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 font-bold transition">
                <i data-lucide="github" class="w-5 h-5"></i> GitHub
            </button>
        </div>

        <p class="mt-10 text-center text-slate-500 font-bold">
            Don't have an account? <a href="register.html" class="text-primary hover:underline">Create Account</a>
        </p>
    </div>

    <script>lucide.createIcons();</script>
</body>

</html>
