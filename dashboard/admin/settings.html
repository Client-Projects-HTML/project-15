<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .sidebar-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 font-sans transition-colors duration-300">

    <div class="flex h-screen overflow-hidden relative">
        <div id="sidebar-backdrop" class="fixed inset-0 z-20 sidebar-overlay hidden lg:hidden"
            onclick="toggleSidebar()"></div>

        <aside id="sidebar"
            class="fixed inset-y-0 left-0 z-30 w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col h-full">
            <div class="p-8 flex justify-between items-center">
                <a href="../../home-1.html" class="flex items-center gap-2 text-2xl font-black text-primary">
                    <i data-lucide="layers" class="w-8 h-8"></i>
                    <span>Vantage</span>
                </a>
                <button class="lg:hidden p-2 text-slate-500" onclick="toggleSidebar()"><i data-lucide="x"
                        class="w-6 h-6"></i></button>
            </div>

            <nav class="flex-1 px-4 space-y-2 py-4 overflow-y-auto">
                <a href="index.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </a>
                <a href="users.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="users" class="w-5 h-5"></i> Users
                </a>
                <a href="orders.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i> Orders
                </a>
                <a href="messages.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="mail" class="w-5 h-5"></i> Messages
                    <span class="ml-auto bg-primary text-white text-[10px] px-2 py-0.5 rounded-full">12</span>
                </a>
                <a href="settings.html"
                    class="flex items-center gap-4 px-4 py-3 bg-primary/10 text-primary rounded-xl font-bold">
                    <i data-lucide="settings" class="w-5 h-5"></i> Settings
                </a>
            </nav>

            <div class="p-6 border-t border-slate-100 dark:border-slate-800">
                <a href="../../login.html"
                    class="flex items-center gap-4 px-4 py-3 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/10 rounded-xl font-bold transition">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </a>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto w-full h-full lg:ml-72 transition-all p-4 md:p-8">
            <div class="lg:hidden flex justify-between items-center mb-6">
                <button onclick="toggleSidebar()"
                    class="p-2 bg-white dark:bg-slate-900 rounded-lg shadow-sm border border-slate-200 dark:border-slate-800">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="flex items-center gap-4">
                    <img src="https://i.pravatar.cc/100?u=admin"
                        class="w-10 h-10 rounded-full border border-slate-200 shadow-sm" alt="Profile">
                </div>
            </div>

            <header class="flex justify-between items-center gap-6 mb-10">
                <div>
                    <h1 class="text-3xl font-black mb-1">Settings</h1>
                    <p class="text-slate-400 font-bold">Manage your account settings.</p>
                </div>
                <div class="flex items-center gap-4">
                    <!-- Theme & RTL Toggles -->
                    <button id="rtl-toggle"
                        class="p-4 rounded-2xl bg-white dark:bg-slate-900 shadow-sm hover:shadow-md transition"
                        title="Toggle RTL">
                        <i data-lucide="languages" class="w-5 h-5"></i>
                    </button>
                    <button id="theme-toggle"
                        class="p-4 rounded-2xl bg-white dark:bg-slate-900 shadow-sm hover:shadow-md transition"
                        title="Toggle Theme">
                        <i data-lucide="sun" class="w-5 h-5 dark:hidden"></i>
                        <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                    </button>
                    <button class="p-4 rounded-2xl bg-white dark:bg-slate-900 shadow-sm hover:shadow-md transition"><i
                            data-lucide="bell" class="w-5 h-5"></i></button>
                    <img src="https://i.pravatar.cc/100?u=admin"
                        class="w-12 h-12 rounded-2xl border-2 border-white dark:border-slate-800 shadow-lg cursor-pointer hover:scale-105 transition"
                        alt="Admin">
                </div>
            </header>

            <div
                class="max-w-4xl bg-white dark:bg-slate-900 rounded-[40px] shadow-sm border border-slate-100 dark:border-slate-800 p-8 sm:p-12">
                <form class="space-y-10">
                    <section class="space-y-6">
                        <h3 class="text-xl font-black">Profile Information</h3>
                        <div class="flex items-center gap-6">
                            <img src="https://i.pravatar.cc/100?u=admin"
                                class="w-24 h-24 rounded-full border-4 border-slate-50 dark:border-slate-800 shadow-lg"
                                alt="Profile">
                            <button type="button"
                                class="bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-6 py-3 rounded-xl font-bold border border-slate-200 dark:border-slate-700 hover:bg-slate-100 transition">Change
                                Avatar</button>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-sm font-bold uppercase tracking-widest text-slate-400">First
                                    Name</label>
                                <input type="text" value="Admin"
                                    class="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-transparent focus:border-primary outline-none transition font-bold">
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-bold uppercase tracking-widest text-slate-400">Last
                                    Name</label>
                                <input type="text" value="User"
                                    class="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-transparent focus:border-primary outline-none transition font-bold">
                            </div>
                            <div class="space-y-2 sm:col-span-2">
                                <label class="text-sm font-bold uppercase tracking-widest text-slate-400">Email
                                    Address</label>
                                <input type="email" value="admin@vantage.com"
                                    class="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-transparent focus:border-primary outline-none transition font-bold">
                            </div>
                        </div>
                    </section>

                    <hr class="border-slate-100 dark:border-slate-800">

                    <section class="space-y-6">
                        <h3 class="text-xl font-black">Preferences</h3>
                        <div class="flex items-center justify-between p-4 rounded-2xl bg-slate-50 dark:bg-slate-800">
                            <div>
                                <p class="font-bold">Email Notifications</p>
                                <p class="text-xs text-slate-400">Receive emails about new orders.</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" checked class="sr-only peer">
                                <div
                                    class="w-11 h-6 bg-slate-200 peer-focus:outline-none dark:bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary">
                                </div>
                            </label>
                        </div>
                        <div class="flex items-center justify-between p-4 rounded-2xl bg-slate-50 dark:bg-slate-800">
                            <div>
                                <p class="font-bold">Dark Mode</p>
                                <p class="text-xs text-slate-400">Use dark theme by default.</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" class="sr-only peer">
                                <div
                                    class="w-11 h-6 bg-slate-200 peer-focus:outline-none dark:bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary">
                                </div>
                            </label>
                        </div>
                    </section>

                    <div class="flex justify-end gap-3 pt-4">
                        <button type="button"
                            class="px-8 py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800 transition">Cancel</button>
                        <button type="submit"
                            class="px-8 py-3 rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/20 hover:bg-primary-dark transition">Save
                            Changes</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-backdrop').classList.toggle('hidden');
        }
    </script>
    <script src="../../assets/js/main.js"></script>
</body>

</html>
