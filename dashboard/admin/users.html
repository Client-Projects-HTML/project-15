<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .sidebar-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 font-sans transition-colors duration-300">

    <div class="flex h-screen overflow-hidden relative">
        <div id="sidebar-backdrop" class="fixed inset-0 z-20 sidebar-overlay hidden lg:hidden"
            onclick="toggleSidebar()"></div>

        <aside id="sidebar"
            class="fixed inset-y-0 left-0 z-30 w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col h-full">
            <div class="p-8 flex justify-between items-center">
                <a href="../../home-1.html" class="flex items-center gap-2 text-2xl font-black text-primary">
                    <i data-lucide="layers" class="w-8 h-8"></i>
                    <span>Vantage</span>
                </a>
                <button class="lg:hidden p-2 text-slate-500" onclick="toggleSidebar()"><i data-lucide="x"
                        class="w-6 h-6"></i></button>
            </div>

            <nav class="flex-1 px-4 space-y-2 py-4 overflow-y-auto">
                <a href="index.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </a>
                <a href="users.html"
                    class="flex items-center gap-4 px-4 py-3 bg-primary/10 text-primary rounded-xl font-bold">
                    <i data-lucide="users" class="w-5 h-5"></i> Users
                </a>
                <a href="orders.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i> Orders
                </a>
                <a href="messages.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="mail" class="w-5 h-5"></i> Messages
                    <span class="ml-auto bg-primary text-white text-[10px] px-2 py-0.5 rounded-full">12</span>
                </a>
                <a href="settings.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="settings" class="w-5 h-5"></i> Settings
                </a>
            </nav>

            <div class="p-6 border-t border-slate-100 dark:border-slate-800">
                <a href="../../login.html"
                    class="flex items-center gap-4 px-4 py-3 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/10 rounded-xl font-bold transition">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </a>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto w-full h-full lg:ml-72 transition-all p-4 md:p-8">
            <div class="lg:hidden flex justify-between items-center mb-6">
                <button onclick="toggleSidebar()"
                    class="p-2 bg-white dark:bg-slate-900 rounded-lg shadow-sm border border-slate-200 dark:border-slate-800">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="flex items-center gap-4">
                    <img src="https://i.pravatar.cc/100?u=admin"
                        class="w-10 h-10 rounded-full border border-slate-200 shadow-sm" alt="Profile">
                </div>
            </div>

            <header class="flex justify-between items-center gap-6 mb-10">
                <div>
                    <h1 class="text-3xl font-black mb-1">User Management</h1>
                    <p class="text-slate-400 font-bold">Manage all registered users.</p>
                </div>
                <div class="flex items-center gap-4">
                    <button
                        class="hidden sm:flex bg-primary hover:bg-primary-dark text-white px-6 py-3 rounded-xl font-bold transition shadow-lg shadow-primary/20 items-center gap-2">
                        <i data-lucide="plus" class="w-5 h-5"></i> Add User
                    </button>
                    <!-- Theme & RTL Toggles -->
                    <button id="rtl-toggle"
                        class="p-4 rounded-2xl bg-white dark:bg-slate-900 shadow-sm hover:shadow-md transition"
                        title="Toggle RTL">
                        <i data-lucide="languages" class="w-5 h-5"></i>
                    </button>
                    <button id="theme-toggle"
                        class="p-4 rounded-2xl bg-white dark:bg-slate-900 shadow-sm hover:shadow-md transition"
                        title="Toggle Theme">
                        <i data-lucide="sun" class="w-5 h-5 dark:hidden"></i>
                        <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                    </button>
                    <img src="https://i.pravatar.cc/100?u=admin"
                        class="w-12 h-12 rounded-2xl border-2 border-white dark:border-slate-800 shadow-lg" alt="Admin">
                </div>
            </header>

            <div
                class="bg-white dark:bg-slate-900 rounded-[40px] shadow-sm border border-slate-100 dark:border-slate-800 overflow-hidden">
                <div
                    class="p-8 border-b border-slate-100 dark:border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div class="relative w-full sm:w-80">
                        <input type="text" placeholder="Search users..."
                            class="w-full p-4 pl-12 rounded-2xl bg-slate-50 dark:bg-slate-800 border-none outline-none focus:ring-2 focus:ring-primary">
                        <i data-lucide="search"
                            class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    </div>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button
                            class="flex-1 sm:flex-none p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 font-bold hover:bg-slate-100 dark:hover:bg-slate-700 transition"><i
                                data-lucide="filter" class="w-5 h-5"></i></button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left min-w-[800px]">
                        <thead>
                            <tr
                                class="text-slate-400 text-xs font-black uppercase tracking-widest border-b dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/50">
                                <th class="py-6 pl-8">User Name</th>
                                <th class="py-6">Role</th>
                                <th class="py-6">Status</th>
                                <th class="py-6">Joined Date</th>
                                <th class="py-6 text-right pr-8">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50 dark:divide-slate-800">
                            <tr class="group hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
                                <td class="py-6 pl-8">
                                    <div class="flex items-center gap-4">
                                        <img src="https://i.pravatar.cc/100?u=u1" class="w-10 h-10 rounded-xl" alt="U">
                                        <div>
                                            <p class="font-bold">Robert Fox</p>
                                            <p class="text-xs text-slate-400">robert@example.com</p>
                                        </div>
                                    </div>
                                </td>
                                <td class="py-6 font-bold text-slate-500">Admin</td>
                                <td class="py-6"><span
                                        class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-600 text-[10px] font-black uppercase tracking-widest">Active</span>
                                </td>
                                <td class="py-6 text-slate-500 font-medium">Oct 24, 2025</td>
                                <td class="py-6 text-right pr-8">
                                    <button
                                        class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition"><i
                                            data-lucide="more-horizontal" class="w-5 h-5 text-slate-400"></i></button>
                                </td>
                            </tr>
                            <tr class="group hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
                                <td class="py-6 pl-8">
                                    <div class="flex items-center gap-4">
                                        <img src="https://i.pravatar.cc/100?u=u2" class="w-10 h-10 rounded-xl" alt="U">
                                        <div>
                                            <p class="font-bold">Cody Fisher</p>
                                            <p class="text-xs text-slate-400">cody@example.com</p>
                                        </div>
                                    </div>
                                </td>
                                <td class="py-6 font-bold text-slate-500">Client</td>
                                <td class="py-6"><span
                                        class="px-3 py-1 rounded-full bg-slate-100 text-slate-500 text-[10px] font-black uppercase tracking-widest">Offline</span>
                                </td>
                                <td class="py-6 text-slate-500 font-medium">Dec 12, 2025</td>
                                <td class="py-6 text-right pr-8">
                                    <button
                                        class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition"><i
                                            data-lucide="more-horizontal" class="w-5 h-5 text-slate-400"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-8 border-t border-slate-100 dark:border-slate-800 flex justify-between items-center">
                    <p class="text-sm font-bold text-slate-400">Showing 1-10 of 450</p>
                    <div class="flex gap-2">
                        <button
                            class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-800 font-bold hover:bg-slate-50 dark:hover:bg-slate-800 transition">Prev</button>
                        <button
                            class="px-4 py-2 rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/20">Next</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-backdrop').classList.toggle('hidden');
        }
    </script>
    <script src="../../assets/js/main.js"></script>
</body>

</html>
