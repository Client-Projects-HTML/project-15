<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoices - Client Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .sidebar-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 font-sans transition-colors duration-300">

    <div class="flex h-screen overflow-hidden relative">
        <div id="sidebar-backdrop" class="fixed inset-0 z-20 sidebar-overlay hidden lg:hidden"
            onclick="toggleSidebar()"></div>

        <aside id="sidebar"
            class="fixed inset-y-0 left-0 z-30 w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col h-full">
            <div class="p-8 flex justify-between items-center">
                <a href="../../home-1.html" class="flex items-center gap-2 text-2xl font-black text-primary">
                    <i data-lucide="layers" class="w-8 h-8"></i>
                    <span>Vantage</span>
                </a>
                <button class="lg:hidden p-2 text-slate-500" onclick="toggleSidebar()"><i data-lucide="x"
                        class="w-6 h-6"></i></button>
            </div>

            <nav class="flex-1 px-4 space-y-2 py-4 overflow-y-auto">
                <a href="index.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Overview
                </a>
                <a href="services.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="briefcase" class="w-5 h-5"></i> My Services
                </a>
                <a href="invoices.html"
                    class="flex items-center gap-4 px-4 py-3 bg-primary/10 text-primary rounded-xl font-bold">
                    <i data-lucide="file-text" class="w-5 h-5"></i> Invoices
                </a>
                <a href="support.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="life-buoy" class="w-5 h-5"></i> Support
                </a>
                <a href="settings.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="settings" class="w-5 h-5"></i> Settings
                </a>
            </nav>

            <div class="p-6 border-t border-slate-100 dark:border-slate-800">
                <a href="../../login.html"
                    class="flex items-center gap-4 px-4 py-3 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/10 rounded-xl font-bold transition">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </a>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto w-full h-full lg:ml-72 transition-all p-4 md:p-8">
            <div class="lg:hidden flex justify-between items-center mb-6">
                <button onclick="toggleSidebar()"
                    class="p-2 bg-white dark:bg-slate-900 rounded-lg shadow-sm border border-slate-200 dark:border-slate-800">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="flex items-center gap-4">
                    <img src="https://i.pravatar.cc/100?u=client"
                        class="w-10 h-10 rounded-full border border-slate-200 shadow-sm" alt="Profile">
                </div>
            </div>

            <header class="flex justify-between items-center gap-6 mb-10">
                <div>
                    <h1 class="text-3xl font-black mb-1">Invoices</h1>
                    <p class="text-slate-400 font-bold">View and download your invoices.</p>
                </div>
                <div class="flex items-center gap-4">
                    <!-- Theme & RTL Toggles -->
                    <button id="rtl-toggle"
                        class="p-4 rounded-2xl bg-white dark:bg-slate-900 shadow-sm hover:shadow-md transition"
                        title="Toggle RTL">
                        <i data-lucide="languages" class="w-5 h-5"></i>
                    </button>
                    <button id="theme-toggle"
                        class="p-4 rounded-2xl bg-white dark:bg-slate-900 shadow-sm hover:shadow-md transition"
                        title="Toggle Theme">
                        <i data-lucide="sun" class="w-5 h-5 dark:hidden"></i>
                        <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                    </button>
                    <button class="p-4 rounded-2xl bg-white dark:bg-slate-900 shadow-sm hover:shadow-md transition"><i
                            data-lucide="bell" class="w-5 h-5"></i></button>
                    <img src="https://i.pravatar.cc/100?u=client"
                        class="w-12 h-12 rounded-2xl border-2 border-white dark:border-slate-800 shadow-lg cursor-pointer hover:scale-105 transition"
                        alt="Client">
                </div>
            </header>

            <div
                class="bg-white dark:bg-slate-900 rounded-[40px] shadow-sm border border-slate-100 dark:border-slate-800 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left min-w-[700px]">
                        <thead>
                            <tr
                                class="text-slate-400 text-xs font-black uppercase tracking-widest border-b dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/50">
                                <th class="py-6 pl-8">Invoice ID</th>
                                <th class="py-6">Date</th>
                                <th class="py-6">Amount</th>
                                <th class="py-6">Status</th>
                                <th class="py-6 text-right pr-8">Download</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50 dark:divide-slate-800">
                            <tr class="group hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
                                <td class="py-6 pl-8 font-bold text-primary">#INV-2024-001</td>
                                <td class="py-6 text-slate-500">Jan 10, 2026</td>
                                <td class="py-6 font-black">$2,500.00</td>
                                <td class="py-6"><span
                                        class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-600 text-[10px] font-black uppercase tracking-widest">Paid</span>
                                </td>
                                <td class="py-6 text-right pr-8">
                                    <button
                                        class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition text-slate-400 hover:text-primary"><i
                                            data-lucide="download" class="w-5 h-5"></i></button>
                                </td>
                            </tr>
                            <tr class="group hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
                                <td class="py-6 pl-8 font-bold text-primary">#INV-2024-002</td>
                                <td class="py-6 text-slate-500">Feb 1, 2026</td>
                                <td class="py-6 font-black">$1,250.00</td>
                                <td class="py-6"><span
                                        class="px-3 py-1 rounded-full bg-amber-100 text-amber-600 text-[10px] font-black uppercase tracking-widest">Unpaid</span>
                                </td>
                                <td class="py-6 text-right pr-8">
                                    <button
                                        class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition text-slate-400 hover:text-primary"><i
                                            data-lucide="download" class="w-5 h-5"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-backdrop').classList.toggle('hidden');
        }
    </script>
    <script src="../../assets/js/main.js"></script>
</body>

</html>
