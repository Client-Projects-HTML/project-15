<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Services - Client Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .sidebar-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 font-sans transition-colors duration-300">

    <div class="flex h-screen overflow-hidden relative">
        <div id="sidebar-backdrop" class="fixed inset-0 z-20 sidebar-overlay hidden lg:hidden"
            onclick="toggleSidebar()"></div>

        <aside id="sidebar"
            class="fixed inset-y-0 left-0 z-30 w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col h-full">
            <div class="p-8 flex justify-between items-center">
                <a href="../../home-1.html" class="flex items-center gap-2 text-2xl font-black text-primary">
                    <i data-lucide="layers" class="w-8 h-8"></i>
                    <span>Vantage</span>
                </a>
                <button class="lg:hidden p-2 text-slate-500" onclick="toggleSidebar()"><i data-lucide="x"
                        class="w-6 h-6"></i></button>
            </div>

            <nav class="flex-1 px-4 space-y-2 py-4 overflow-y-auto">
                <a href="index.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Overview
                </a>
                <a href="services.html"
                    class="flex items-center gap-4 px-4 py-3 bg-primary/10 text-primary rounded-xl font-bold">
                    <i data-lucide="briefcase" class="w-5 h-5"></i> My Services
                </a>
                <a href="invoices.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="file-text" class="w-5 h-5"></i> Invoices
                </a>
                <a href="support.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="life-buoy" class="w-5 h-5"></i> Support
                </a>
                <a href="settings.html"
                    class="flex items-center gap-4 px-4 py-3 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-bold transition">
                    <i data-lucide="settings" class="w-5 h-5"></i> Settings
                </a>
            </nav>

            <div class="p-6 border-t border-slate-100 dark:border-slate-800">
                <a href="../../login.html"
                    class="flex items-center gap-4 px-4 py-3 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/10 rounded-xl font-bold transition">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </a>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto w-full h-full lg:ml-72 transition-all p-4 md:p-8">
            <div class="lg:hidden flex justify-between items-center mb-6">
                <button onclick="toggleSidebar()"
                    class="p-2 bg-white dark:bg-slate-900 rounded-lg shadow-sm border border-slate-200 dark:border-slate-800">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="flex items-center gap-4">
                    <img src="https://i.pravatar.cc/100?u=client"
                        class="w-10 h-10 rounded-full border border-slate-200 shadow-sm" alt="Profile">
                </div>
            </div>

            <header class="flex justify-between items-center gap-6 mb-10">
                <div>
                    <h1 class="text-3xl font-black mb-1">My Services</h1>
                    <p class="text-slate-400 font-bold">Manage your active subscriptions.</p>
                </div>
                <div class="flex items-center gap-4">
                    <button
                        class="hidden md:flex bg-primary text-white px-6 py-3 rounded-xl font-bold hover:bg-primary-dark transition shadow-lg shadow-primary/20">
                        Browse New Services
                    </button>
                    <!-- Theme & RTL Toggles -->
                    <button id="rtl-toggle"
                        class="p-4 rounded-2xl bg-white dark:bg-slate-900 shadow-sm hover:shadow-md transition"
                        title="Toggle RTL">
                        <i data-lucide="languages" class="w-5 h-5"></i>
                    </button>
                    <button id="theme-toggle"
                        class="p-4 rounded-2xl bg-white dark:bg-slate-900 shadow-sm hover:shadow-md transition"
                        title="Toggle Theme">
                        <i data-lucide="sun" class="w-5 h-5 dark:hidden"></i>
                        <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                    </button>
                    <img src="https://i.pravatar.cc/100?u=client"
                        class="w-12 h-12 rounded-2xl border-2 border-white dark:border-slate-800 shadow-lg cursor-pointer hover:scale-105 transition"
                        alt="Client">
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
                <!-- Service Card 1 -->
                <div
                    class="group bg-white dark:bg-slate-900 rounded-[32px] p-8 border border-slate-100 dark:border-slate-800 hover:shadow-xl hover:shadow-primary/5 transition duration-300 relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-8 opacity-10 group-hover:scale-110 transition duration-500">
                        <i data-lucide="globe" class="w-32 h-32 text-primary"></i>
                    </div>
                    <div
                        class="w-16 h-16 rounded-2xl bg-blue-100 dark:bg-blue-900/30 text-blue-600 flex items-center justify-center mb-6">
                        <i data-lucide="globe" class="w-8 h-8"></i>
                    </div>
                    <h3 class="text-2xl font-black mb-2">Web Development</h3>
                    <p class="text-slate-500 mb-6 text-sm">Full-stack website overhaul including design.</p>

                    <div class="mb-6">
                        <div class="flex justify-between text-xs font-bold mb-2">
                            <span>Progress</span>
                            <span class="text-primary">75%</span>
                        </div>
                        <div class="h-2 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                            <div class="h-full bg-primary w-3/4 rounded-full"></div>
                        </div>
                    </div>

                    <div class="flex gap-3">
                        <button
                            class="flex-1 py-3 rounded-xl border border-slate-200 dark:border-slate-700 font-bold hover:bg-slate-50 dark:hover:bg-slate-800 transition">Details</button>
                        <button
                            class="flex-1 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 font-bold hover:bg-slate-100 dark:hover:bg-slate-700 transition">Contact</button>
                    </div>
                </div>

                <!-- Service Card 2 -->
                <div
                    class="group bg-white dark:bg-slate-900 rounded-[32px] p-8 border border-slate-100 dark:border-slate-800 hover:shadow-xl hover:shadow-primary/5 transition duration-300 relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-8 opacity-10 group-hover:scale-110 transition duration-500">
                        <i data-lucide="bar-chart" class="w-32 h-32 text-emerald-500"></i>
                    </div>
                    <div
                        class="w-16 h-16 rounded-2xl bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 flex items-center justify-center mb-6">
                        <i data-lucide="bar-chart" class="w-8 h-8"></i>
                    </div>
                    <h3 class="text-2xl font-black mb-2">SEO Optimization</h3>
                    <p class="text-slate-500 mb-6 text-sm">Monthly SEO audit and content strategy.</p>

                    <div class="mb-6">
                        <div class="flex justify-between text-xs font-bold mb-2">
                            <span>Progress</span>
                            <span class="text-emerald-500">Running</span>
                        </div>
                        <div class="h-2 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                            <div class="h-full bg-emerald-500 w-full rounded-full animate-pulse"></div>
                        </div>
                    </div>

                    <div class="flex gap-3">
                        <button
                            class="flex-1 py-3 rounded-xl border border-slate-200 dark:border-slate-700 font-bold hover:bg-slate-50 dark:hover:bg-slate-800 transition">Details</button>
                        <button
                            class="flex-1 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 font-bold hover:bg-slate-100 dark:hover:bg-slate-700 transition">Report</button>
                    </div>
                </div>

                <!-- Add New Service -->
                <div
                    class="rounded-[32px] border-2 border-dashed border-slate-200 dark:border-slate-800 flex flex-col items-center justify-center p-8 cursor-pointer hover:border-primary hover:bg-primary/5 transition group">
                    <div
                        class="w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center mb-4 group-hover:bg-primary group-hover:text-white transition">
                        <i data-lucide="plus" class="w-8 h-8 text-slate-400 group-hover:text-white transition"></i>
                    </div>
                    <h3 class="text-xl font-black text-slate-400 group-hover:text-primary transition">Request New
                        Service</h3>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-backdrop').classList.toggle('hidden');
        }
    </script>
    <script src="../../assets/js/main.js"></script>
</body>

</html>
