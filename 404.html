<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolygon points='12 2 2 7 12 12 22 7 12 2'/%3E%3Cpolyline points='2 17 12 22 22 17'/%3E%3Cpolyline points='2 12 12 17 22 12'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#3b82f6' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-slate-50 dark:bg-slate-950 font-sans flex items-center justify-center min-h-screen p-4 text-center">

    <div class="max-w-md w-full">
        <div class="relative mb-8">
            <h1
                class="text-[150px] md:text-[200px] font-black leading-none select-none text-transparent bg-clip-text bg-gradient-to-b from-primary to-primary/20">
                404</h1>
            <div class="absolute inset-0 flex items-center justify-center -z-10">
                <i data-lucide="compass" class="w-48 h-48 text-primary animate-spin-slow opacity-10"></i>
            </div>
        </div>

        <h2 class="text-3xl font-black mb-4">Lost in the Digital Maze?</h2>
        <p class="text-slate-500 mb-10 text-lg">The page you're looking for was moved, removed, or never existed. Let's
            get you back on track.</p>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="home-1.html"
                class="bg-primary hover:bg-primary-dark text-white px-8 py-4 rounded-2xl font-black transition shadow-lg shadow-primary/20">Back
                to Home</a>
            <a href="contact.html"
                class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-8 py-4 rounded-2xl font-black hover:bg-slate-50 dark:hover:bg-slate-800 transition">Contact
                Support</a>
        </div>
    </div>

    <style>
        @keyframes spin-slow {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin-slow {
            animation: spin-slow 12s linear infinite;
        }
    </style>
    <script>lucide.createIcons();</script>
</body>

</html>
