<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Vantage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-slate-900 text-white font-sans flex items-center justify-center min-h-screen p-4 overflow-hidden">

    <!-- Background Decoration -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 opacity-20">
        <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-primary rounded-full blur-[120px] animate-pulse">
        </div>
        <div
            class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-purple-600 rounded-full blur-[120px] animate-pulse delay-700">
        </div>
    </div>

    <div class="text-center max-w-3xl">
        <a href="home-1.html" class="inline-flex items-center gap-2 text-2xl font-black text-primary mb-12">
            <i data-lucide="layers" class="w-8 h-8"></i>
            <span>Vantage</span>
        </a>

        <h1 class="text-6xl md:text-8xl font-black mb-8 leading-tight">Something Great is <span
                class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-purple-400">Under Way</span></h1>
        <p class="text-xl text-slate-400 mb-16">We're working hard to bring you a new experience. Subscribe to get
            notified on launch day!</p>

        <!-- Countdown -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-16 px-4">
            <div class="p-8 rounded-3xl bg-white/5 border border-white/10 backdrop-blur-xl">
                <span class="text-5xl font-black block mb-2" id="days">24</span>
                <span class="text-xs font-bold uppercase tracking-widest text-slate-500">Days</span>
            </div>
            <div class="p-8 rounded-3xl bg-white/5 border border-white/10 backdrop-blur-xl">
                <span class="text-5xl font-black block mb-2" id="hours">12</span>
                <span class="text-xs font-bold uppercase tracking-widest text-slate-500">Hours</span>
            </div>
            <div class="p-8 rounded-3xl bg-white/5 border border-white/10 backdrop-blur-xl">
                <span class="text-5xl font-black block mb-2" id="mins">45</span>
                <span class="text-xs font-bold uppercase tracking-widest text-slate-500">Mins</span>
            </div>
            <div class="p-8 rounded-3xl bg-white/5 border border-white/10 backdrop-blur-xl">
                <span class="text-5xl font-black block mb-2" id="secs">08</span>
                <span class="text-xs font-bold uppercase tracking-widest text-slate-500">Secs</span>
            </div>
        </div>

        <form action="#" class="flex flex-col sm:flex-row gap-4 max-w-lg mx-auto">
            <input type="email" placeholder="Enter your email..."
                class="flex-1 p-5 rounded-2xl bg-white/10 border border-white/10 outline-none focus:border-primary transition font-bold">
            <button
                class="bg-primary hover:bg-primary-dark text-white px-10 py-5 rounded-2xl font-black transition shadow-xl shadow-primary/20">Notify
                Me</button>
        </form>

        <div class="mt-20 flex justify-center gap-6 opacity-60">
            <a href="#" class="hover:text-primary transition"><i data-lucide="twitter" class="w-6 h-6"></i></a>
            <a href="#" class="hover:text-primary transition"><i data-lucide="instagram" class="w-6 h-6"></i></a>
            <a href="#" class="hover:text-primary transition"><i data-lucide="linkedin" class="w-6 h-6"></i></a>
        </div>
    </div>

    <script>
        lucide.createIcons();
        // Simple countdown simulation
        setInterval(() => {
            const secs = document.getElementById('secs');
            let val = parseInt(secs.innerText);
            val = val > 0 ? val - 1 : 59;
            secs.innerText = val.toString().padStart(2, '0');
        }, 1000);
    </script>
</body>

</html>
