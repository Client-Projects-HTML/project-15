<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Vantage</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23AD49E1'/%3E%3Cg transform='translate(6,6)' stroke='%23ffffff' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolygon points='10,2 2,6 10,10 18,6'/%3E%3Cpolyline points='2,10 10,14 18,10'/%3E%3Cpolyline points='2,14 10,18 18,14'/%3E%3C/g%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
        <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#AD49E1',
                            dark: '#9333C3',
                            light: '#F5E9FD',
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-slate-900 text-white font-sans flex items-center justify-center h-screen p-4 overflow-hidden">

    <!-- Background Decoration -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 opacity-20">
        <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-primary rounded-full blur-[120px] animate-pulse">
        </div>
        <div
            class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-purple-600 rounded-full blur-[120px] animate-pulse delay-700">
        </div>
    </div>

    <div class="text-center max-w-3xl">
        <a href="home-1.html" class="inline-flex items-center gap-2 text-2xl font-black text-primary mb-8">
            <i data-lucide="layers" class="w-4 h-4 text-white"></i>
            <span>Vantage</span>
        </a>

        <h1 class="text-5xl md:text-7xl font-black mb-6 leading-tight">Featured Events <span
                class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-purple-400">Coming Soon</span>
        </h1>
        <p class="text-lg text-slate-400 mb-8">We're curating exclusive industry events and workshops. Subscribe to get
            notified on our first launch!</p>

        <!-- Countdown -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 px-2">
            <div class="p-6 rounded-3xl bg-white/5 border border-white/10 backdrop-blur-xl">
                <span class="text-4xl font-black block mb-1" id="days">24</span>
                <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Days</span>
            </div>
            <div class="p-6 rounded-3xl bg-white/5 border border-white/10 backdrop-blur-xl">
                <span class="text-4xl font-black block mb-1" id="hours">12</span>
                <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Hours</span>
            </div>
            <div class="p-6 rounded-3xl bg-white/5 border border-white/10 backdrop-blur-xl">
                <span class="text-4xl font-black block mb-1" id="mins">45</span>
                <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Mins</span>
            </div>
            <div class="p-6 rounded-3xl bg-white/5 border border-white/10 backdrop-blur-xl">
                <span class="text-4xl font-black block mb-1" id="secs">08</span>
                <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Secs</span>
            </div>
        </div>

        <div id="notify-container">
            <form id="notify-form" class="flex flex-col sm:flex-row gap-4 max-w-lg mx-auto mb-8">
                <input type="email" required placeholder="Enter your email..."
                    class="flex-1 p-4 rounded-2xl bg-white/10 border border-white/10 outline-none focus:border-primary transition font-bold">
                <button type="submit"
                    class="bg-primary hover:bg-primary-dark text-white px-8 py-4 rounded-2xl font-black transition shadow-xl shadow-primary/20 btn-primary">Notify
                    Me</button>
            </form>
            <div id="success-msg"
                class="hidden animate-fade-in p-6 rounded-3xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-bold mb-8">
                <i data-lucide="check-circle" class="w-8 h-8 mx-auto mb-2 text-emerald-400"></i>
                <p>Perfect! We'll notify you as soon as we launch.</p>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();
        // Handle Form Submission
        const notifyForm = document.getElementById('notify-form');
        const successMsg = document.getElementById('success-msg');

        if (notifyForm) {
            notifyForm.addEventListener('submit', (e) => {
                e.preventDefault();
                notifyForm.classList.add('hidden');
                successMsg.classList.remove('hidden');
                lucide.createIcons(); // Re-render icon in the success message
            });
        }

        // Simple countdown simulation
        setInterval(() => {
            const secs = document.getElementById('secs');
            let val = parseInt(secs.innerText);
            val = val > 0 ? val - 1 : 59;
            secs.innerText = val.toString().padStart(2, '0');
        }, 1000);
    </script>
</body>

</html>
